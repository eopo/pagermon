name: pagermon-ingest
services:
  worker:
    image: ghcr.io/pagermon/pagermon-ingest-worker:latest
    restart: unless-stopped
    env_file: stack.env
    depends_on:
      - redis
  agent:
    image: ghcr.io/pagermon/pagermon-ingest-agent:latest
    restart: unless-stopped
    env_file: stack.env
    privileged: true
    depends_on:
      - redis
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
volumes:
  redis-data: